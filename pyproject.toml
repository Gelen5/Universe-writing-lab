[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-autosync"
version = "0.1.0"
description = "微信公众号 × 飞书知识库 自增长自动化同步与数据分析系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["wechat", "feishu", "lark", "knowledge-base", "automation", "content"]
authors = [{ name = "kb_autosync" }]
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "markdown>=3.4",
    "beautifulsoup4>=4.11",
    "html2text>=2020.1.1",
]

[project.scripts]
kb_autosync = "kb_autosync.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["kb_autosync", "kb_autosync.feishu"]
